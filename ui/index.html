<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>তাযকিয়া ডাউনলোডার</title>
<style>
@font-face { font-family: "Noto Sans Bengali"; src: url("fonts/NotoSansBengali.ttf") format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Anek Bangla Condensed"; src: url("fonts/anek-bangla-condensed-800.woff2") format("woff2"); font-weight: 800;
  unicode-range: U+0951-0952, U+0964-0965, U+0980-09FE, U+200C-200D, U+25CC; }
@font-face { font-family: "Barlow"; src: url("fonts/barlow-400.woff2") format("woff2"); font-weight: 400;
  unicode-range: U+0000-00FF, U+2000-200B, U+200E-206F, U+2212; }
@font-face { font-family: "Barlow"; src: url("fonts/barlow-600.woff2") format("woff2"); font-weight: 500 700;
  unicode-range: U+0000-00FF, U+2000-200B, U+200E-206F, U+2212; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-800.woff2") format("woff2"); font-weight: 800;
  unicode-range: U+0000-00FF, U+2000-200B, U+200E-206F, U+2212; }

:root {
  color-scheme: light;
  --bg: #F4F4F0; --surface: #FFFFFF; --surface-2: #EDEDE8; --text: #0A0A0A; --muted: #52525B;
  --line: #DDDDD8; --line-2: #CFCFCA;
  --primary: #0A0A0A; --on-primary: #FFFFFF;
  --soft: #FEF3C7; --on-soft: #3D3300;
  --ok: #15803D; --err: #B3261E; --focus: #0A0A0A;
  --ink: #0A0A0A; --ink-text: #F4F4F0; --ink-muted: #A1A1AA; --ink-line: #333333;
  --accent: #FACC15; --on-accent: #0A0A0A;
  --radius: 4px;
  --font-body: "Barlow", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Barlow Condensed", "Anek Bangla Condensed", "Noto Sans Bengali", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0A0A0A; --surface: #18181B; --surface-2: #27272A; --text: #F4F4F0; --muted: #A1A1AA;
    --line: #2E2E33; --line-2: #3F3F46;
    --primary: #FACC15; --on-primary: #0A0A0A;
    --soft: #2B2611; --on-soft: #FDE68A;
    --ok: #4ADE80; --err: #FF8A80; --focus: #FACC15; --ink: #111111;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A0A0A; --surface: #18181B; --surface-2: #27272A; --text: #F4F4F0; --muted: #A1A1AA;
  --line: #2E2E33; --line-2: #3F3F46;
  --primary: #FACC15; --on-primary: #0A0A0A;
  --soft: #2B2611; --on-soft: #FDE68A;
  --ok: #4ADE80; --err: #FF8A80; --focus: #FACC15; --ink: #111111;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- header ---------- */
.top { background: var(--ink); color: var(--ink-text); --focus: var(--accent); }
.top-in { max-width: 920px; margin: 0 auto; padding: 18px 20px 22px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 40px; height: 40px; border-radius: var(--radius); }
.brand h1 { margin: 0; font: 800 26px/1.1 var(--font-head); letter-spacing: .2px; }
.brand p { margin: 2px 0 0; color: var(--ink-muted); font-size: 13px; }
.brand .sp { flex: 1; }
.icon-btn { background: none; border: 1px solid var(--ink-line); color: var(--ink-text); border-radius: var(--radius);
  width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }

.search { margin-top: 18px; display: flex; gap: 8px; }
.field { flex: 1; position: relative; }
.field input { width: 100%; height: 50px; padding: 0 92px 0 16px; border-radius: var(--radius);
  border: 1px solid var(--ink-line); background: #18181B; color: var(--ink-text); font-size: 16px; }
.field input::placeholder { color: #71717A; }
.field input:focus { border-color: var(--accent); outline: none; }
.paste { position: absolute; right: 6px; top: 7px; height: 36px; padding: 0 12px; border-radius: var(--radius);
  background: #27272A; border: 0; color: var(--ink-text); cursor: pointer; font-size: 14px; }
.paste:hover { background: #3F3F46; }
.btn { height: 50px; padding: 0 22px; border-radius: var(--radius); border: 0; cursor: pointer;
  font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn-accent { background: var(--accent); color: var(--on-accent); }
.btn-accent:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: default; }
.hint { margin: 10px 0 0; color: var(--ink-muted); font-size: 13px; }

/* ---------- main ---------- */
main { max-width: 920px; margin: 0 auto; padding: 20px 20px 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.notice { padding: 12px 14px; border-radius: var(--radius); background: var(--soft); color: var(--on-soft); font-size: 14px; margin-bottom: 16px; }
.error { padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--err); color: var(--err); margin-bottom: 16px; }

.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty h2 { color: var(--text); font: 800 22px/1.2 var(--font-head); margin: 0 0 8px; }
.empty ol { display: inline-block; text-align: left; margin: 8px 0 0; padding-left: 22px; }

.loading { display: flex; align-items: center; gap: 12px; padding: 24px; color: var(--muted); }
.spin { width: 22px; height: 22px; border: 3px solid var(--line-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.head { padding: 18px 18px 14px; display: flex; gap: 16px; align-items: flex-start; }
.head img { width: 160px; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius); background: var(--surface-2); flex: none; }
.head h2 { margin: 0 0 4px; font: 800 22px/1.25 var(--font-head); }
.head .meta { color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; margin-top: 10px; }
.seg button { border: 0; background: none; padding: 7px 14px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); font-weight: 600; }

.opts { border-top: 1px solid var(--line); padding: 14px 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 20px; }
.opt label.l { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: none; }
select { height: 38px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--surface); width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; margin-top: 4px; }
.check input { width: 17px; height: 17px; accent-color: var(--primary); margin: 0; }
.folder { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; align-items: center; }
.folder .path { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.folder .path span { direction: ltr; unicode-bidi: plaintext; }
.btn-sm { height: 36px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn-sm:hover { border-color: var(--text); }
.btn-sm.danger { color: var(--err); }
.go { border-top: 1px solid var(--line); padding: 14px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.go .sum { flex: 1; color: var(--muted); font-size: 14px; min-width: 180px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }

.list-head { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
.list-head h3 { margin: 0; flex: 1; font: 800 18px/1.2 var(--font-head); }
.link { background: none; border: 0; color: var(--text); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; padding: 4px; }
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .n { width: 30px; text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
.row img { width: 96px; aspect-ratio: 16/9; object-fit: cover; border-radius: 3px; background: var(--surface-2); flex: none; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .t small { color: var(--muted); font-size: 13px; }
.row .t small.err { color: var(--err); }
.row .t small.ok { color: var(--ok); }
label.row { cursor: pointer; }
label.row:hover { background: var(--surface-2); }
.row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); flex: none; margin: 0; }
.bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--primary); width: 0; transition: width .3s; }
.badge { flex: none; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.badge.err { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
.badge.run { background: var(--soft); color: var(--on-soft); }
.row .open { flex: none; }

.overall { padding: 18px; }
.overall h2 { margin: 0 0 2px; font: 800 22px/1.25 var(--font-head); }
.overall .meta { color: var(--muted); font-size: 14px; }
.overall .bar { height: 8px; margin-top: 14px; border-radius: 4px; }
.overall .counts { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

footer { max-width: 920px; margin: 0 auto; padding: 0 20px 28px; color: var(--muted); font-size: 12.5px; }

@media (max-width: 600px) {
  .head { flex-direction: column; }
  .head img { width: 100%; }
  .row img { width: 72px; }
  .search { flex-wrap: wrap; }
  .search .btn { width: 100%; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <img src="mark.svg" alt="">
      <div>
        <h1>তাযকিয়া ডাউনলোডার</h1>
        <p>ইউটিউব ভিডিও বা পুরো প্লেলিস্ট ডাউনলোড করুন</p>
      </div>
      <span class="sp"></span>
      <button class="icon-btn" id="theme" type="button" aria-label="থিম বদলান" title="থিম বদলান"></button>
    </div>
    <form class="search" id="form" autocomplete="off">
      <div class="field">
        <input id="link" type="text" inputmode="url" spellcheck="false"
               placeholder="ইউটিউব ভিডিও বা প্লেলিস্টের লিংক দিন" aria-label="ইউটিউব লিংক">
        <button class="paste" id="paste" type="button">পেস্ট</button>
      </div>
      <button class="btn btn-accent" id="find" type="submit">খুঁজুন</button>
    </form>
    <p class="hint">ভিডিও, প্লেলিস্ট, শর্টস বা চ্যানেলের লিংক — যেকোনোটা দিলেই হবে।</p>
  </div>
</header>

<main id="main">
  <div id="tools-note" class="notice" hidden></div>
  <div id="err" class="error" role="alert" hidden></div>
  <section id="view"></section>
</main>

<footer id="foot"></footer>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const bnDigits = "০১২৩৪৫৬৭৮৯";
const bn = (n) => String(n).replace(/\d/g, (d) => bnDigits[d]);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const thumb = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`;

function dur(sec) {
  if (sec == null) return "";
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (x) => String(x).padStart(2, "0");
  return bn(h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`);
}
function longDur(sec) {
  if (!sec) return "";
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${bn(h)} ঘণ্টা ${m ? bn(m) + " মিনিট" : ""}`.trim() : `${bn(m)} মিনিট`;
}
function size(b) {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return bn(b.toFixed(i >= 2 ? 1 : 0)) + " " + u[i];
}

// ---------- state ----------
const S = { settings: {}, tools: {}, browsers: [], info: null, onlyVideo: false, selected: new Set(), poll: null, job: null };
const api = () => window.pywebview.api;

function showError(msg) { const e = $("#err"); e.textContent = msg || ""; e.hidden = !msg; }

// ---------- theme ----------
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  $("#theme").innerHTML = isDark() ? ICON_SUN : ICON_MOON;
}
$("#theme").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  applyTheme(t); api().save_settings({ theme: t });
});

// ---------- views ----------
function renderEmpty() {
  $("#view").innerHTML = `
    <div class="card empty">
      <h2>কীভাবে ব্যবহার করবেন</h2>
      <ol>
        <li>ইউটিউবে ভিডিও বা প্লেলিস্ট খুলে লিংকটি কপি করুন।</li>
        <li>ওপরের ঘরে পেস্ট করে <b>খুঁজুন</b> চাপুন।</li>
        <li>কোনগুলো লাগবে বেছে নিয়ে, ভিডিও না শুধু অডিও ঠিক করে <b>ডাউনলোড শুরু করুন</b>।</li>
      </ol>
    </div>`;
}

function renderLoading() {
  $("#view").innerHTML = `<div class="card loading"><div class="spin"></div><span>লিংকটি খোঁজা হচ্ছে…</span></div>`;
}

function currentEntries() {
  const info = S.info;
  if (info.kind === "playlist" && S.onlyVideo && info.videoId) {
    const e = info.entries.find((x) => x.id === info.videoId);
    return [e || { id: info.videoId, title: info.title }];
  }
  return info.entries;
}

function renderInfo() {
  const info = S.info, st = S.settings;
  const entries = currentEntries();
  const isList = entries.length > 1 || (info.kind === "playlist" && !S.onlyVideo);
  const chosen = entries.filter((e) => S.selected.has(e.id));
  const total = chosen.reduce((a, e) => a + (e.duration || 0), 0);
  const first = entries[0];
  const audio = st.mode === "audio";

  $("#view").innerHTML = `
    <div class="card">
      <div class="head">
        <img src="${thumb(first.id)}" alt="">
        <div>
          <h2>${esc(S.onlyVideo && first ? first.title : info.title)}</h2>
          <div class="meta">${esc(info.uploader)}${info.uploader ? " · " : ""}${isList ? `${bn(entries.length)}টি ভিডিও` : dur(first.duration)}</div>
          ${info.kind === "playlist" && info.videoId ? `
            <div class="seg" role="group" aria-label="কী ডাউনলোড হবে">
              <button type="button" data-scope="all" aria-pressed="${!S.onlyVideo}">পুরো প্লেলিস্ট (${bn(info.entries.length)})</button>
              <button type="button" data-scope="one" aria-pressed="${S.onlyVideo}">শুধু এই ভিডিও</button>
            </div>` : ""}
        </div>
      </div>
      <div class="opts">
        <div class="opt">
          <label class="l">কী হিসেবে</label>
          <div class="seg" role="group" aria-label="ভিডিও না অডিও" style="margin-top:0">
            <button type="button" data-mode="video" aria-pressed="${!audio}">ভিডিও</button>
            <button type="button" data-mode="audio" aria-pressed="${audio}">শুধু অডিও</button>
          </div>
        </div>
        <div class="opt" ${audio ? "hidden" : ""}>
          <label class="l" for="quality">ভিডিওর মান</label>
          <select id="quality">
            ${[["best", "সবচেয়ে ভালো"], ["1080", "1080p (Full HD)"], ["720", "720p (HD)"], ["480", "480p"], ["360", "360p (কম ডেটা)"]]
              .map(([v, l]) => `<option value="${v}" ${st.quality === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
        </div>
        <div class="opt" ${audio ? "" : "hidden"}>
          <label class="l" for="afmt">অডিও ফরম্যাট</label>
          <select id="afmt">
            <option value="mp3" ${st.audioFormat === "mp3" ? "selected" : ""}>MP3 (সব ডিভাইসে চলে)</option>
            <option value="m4a" ${st.audioFormat === "m4a" ? "selected" : ""}>M4A (ছোট ফাইল, দ্রুত)</option>
          </select>
        </div>
        <div class="opt" ${isList ? "" : "hidden"}>
          <label class="l">প্লেলিস্টের জন্য</label>
          <label class="check"><input type="checkbox" id="numbered" ${st.numbered !== false ? "checked" : ""}> ফাইলের নামের আগে ক্রমিক নম্বর</label>
          <label class="check"><input type="checkbox" id="subfolder" checked> প্লেলিস্টের নামে আলাদা ফোল্ডার</label>
        </div>
        <div class="opt">
          <label class="l" for="cookies">ইউটিউব "bot" বলে আটকালে</label>
          <select id="cookies">
            ${[["", "কিছু করবেন না"], ["firefox", "Firefox-এর লগইন ব্যবহার করুন"], ["chrome", "Chrome-এর লগইন ব্যবহার করুন"],
               ["edge", "Edge-এর লগইন ব্যবহার করুন"], ["brave", "Brave-এর লগইন ব্যবহার করুন"], ["safari", "Safari-এর লগইন ব্যবহার করুন"]]
              .filter(([v]) => !v || S.browsers.includes(v))
              .map(([v, l]) => `<option value="${v}" ${(st.cookies || "") === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="folder">
        <span>📁</span>
        <div class="path" title="${esc(st.folder)}"><span>${esc(st.folder)}</span></div>
        <button class="btn-sm" type="button" id="pick">ফোল্ডার বদলান</button>
      </div>
      <div class="go">
        <div class="sum">${bn(chosen.length)}টি বাছাই করা${total ? ` · মোট ${longDur(total)}` : ""}</div>
        <button class="btn btn-primary" type="button" id="start" ${chosen.length ? "" : "disabled"}>ডাউনলোড শুরু করুন</button>
      </div>
    </div>
    ${isList ? `
      <div class="list-head">
        <h3>ভিডিওগুলো</h3>
        <button class="link" type="button" id="all">সব বাছুন</button>
        <button class="link" type="button" id="none">কোনোটাই না</button>
      </div>
      <ul class="list card">
        ${entries.map((e, i) => `
          <li><label class="row">
            <input type="checkbox" data-id="${esc(e.id)}" ${S.selected.has(e.id) ? "checked" : ""}>
            <span class="n">${bn(i + 1)}</span>
            <img loading="lazy" src="${thumb(e.id)}" alt="">
            <span class="t"><b>${esc(e.title)}</b><small>${dur(e.duration)}</small></span>
          </label></li>`).join("")}
      </ul>` : ""}
  `;
}

function onInfoClick(ev) {
  const t = ev.target.closest("button, input");
  if (!t || !S.info) return;
  if (t.dataset.scope) {
    S.onlyVideo = t.dataset.scope === "one";
    S.selected = new Set(currentEntries().map((e) => e.id));
    renderInfo();
  } else if (t.dataset.mode) {
    S.settings.mode = t.dataset.mode; api().save_settings({ mode: S.settings.mode }); renderInfo();
  } else if (t.id === "all" || t.id === "none") {
    S.selected = t.id === "all" ? new Set(currentEntries().map((e) => e.id)) : new Set();
    renderInfo();
  } else if (t.matches("input[data-id]")) {
    t.checked ? S.selected.add(t.dataset.id) : S.selected.delete(t.dataset.id);
    const chosen = currentEntries().filter((e) => S.selected.has(e.id));
    const total = chosen.reduce((a, e) => a + (e.duration || 0), 0);
    $(".go .sum").textContent = `${bn(chosen.length)}টি বাছাই করা${total ? ` · মোট ${longDur(total)}` : ""}`;
    $("#start").disabled = !chosen.length;
  } else if (t.id === "pick") {
    api().pick_folder().then((f) => { if (f) { S.settings.folder = f; renderInfo(); } });
  } else if (t.id === "start") {
    startDownload();
  }
}

function onInfoChange(ev) {
  const t = ev.target;
  if (t.id === "quality") { S.settings.quality = t.value; api().save_settings({ quality: t.value }); }
  if (t.id === "afmt") { S.settings.audioFormat = t.value; api().save_settings({ audioFormat: t.value }); }
  if (t.id === "cookies") { S.settings.cookies = t.value; api().save_settings({ cookies: t.value }); }
  if (t.id === "numbered") { S.settings.numbered = t.checked; api().save_settings({ numbered: t.checked }); }
}

async function startDownload() {
  const info = S.info, all = currentEntries();
  const entries = all.map((e, i) => ({ ...e, index: i + 1 })).filter((e) => S.selected.has(e.id));
  const isList = all.length > 1;
  const sub = isList && $("#subfolder")?.checked ? info.title : "";
  showError("");
  $("#start").disabled = true;
  const res = await api().start({
    entries, mode: S.settings.mode, quality: S.settings.quality, audioFormat: S.settings.audioFormat,
    numbered: isList && $("#numbered")?.checked, subfolder: sub,
  });
  if (!res.ok) { showError(res.error); $("#start").disabled = false; return; }
  S.jobTitle = S.onlyVideo ? all[0].title : info.title;
  startPolling();
}

// ---------- progress ----------
const STATE_LABEL = {
  queued: ["অপেক্ষায়", ""], waiting: ["একটু অপেক্ষা", "run"], downloading: ["ডাউনলোড হচ্ছে", "run"], processing: ["ফাইল তৈরি হচ্ছে", "run"],
  done: ["সম্পন্ন", "ok"], skipped: ["বাদ দেওয়া হয়েছে", ""], error: ["ব্যর্থ", "err"], cancelled: ["বাতিল", ""],
};

function renderJob(job) {
  const c = job.counts, finished = (c.done || 0) + (c.error || 0) + (c.skipped || 0) + (c.cancelled || 0);
  const cur = job.items.find((i) => i.state === "downloading" || i.state === "processing");
  const pct = ((finished + (cur ? cur.progress : 0)) / job.total) * 100;
  const failed = (c.error || 0) + (c.cancelled || 0);
  const title = S.jobTitle || (job.items.length === 1 ? job.items[0].title : "ডাউনলোড");

  let status;
  if (job.running) status = `${bn(job.total)}টির মধ্যে ${bn(finished)}টি শেষ`;
  else if (!failed) status = job.total === 1 ? "ডাউনলোড শেষ হয়েছে।" : `সবগুলো (${bn(c.done || 0)}টি) ডাউনলোড শেষ হয়েছে।`;
  else status = `${bn(c.done || 0)}টি সম্পন্ন, ${bn(failed)}টি হয়নি।`;

  const html = `
    <div class="card overall">
      <h2>${esc(title)}</h2>
      <div class="meta">${status}</div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="actions">
        ${job.running ? `
          ${job.total > 1 ? `<button class="btn-sm" data-act="skip">এটা বাদ দিন</button>` : ""}
          <button class="btn-sm danger" data-act="cancel">সব বাতিল করুন</button>` : `
          ${failed ? `<button class="btn-sm" data-act="retry">ব্যর্থগুলো আবার চেষ্টা করুন</button>` : ""}
          <button class="btn-sm" data-act="new">নতুন লিংক</button>`}
        <button class="btn-sm" data-act="folder">ফোল্ডার খুলুন</button>
      </div>
    </div>
    <div class="list-head"><h3>তালিকা</h3></div>
    <ul class="list card">
      ${job.items.map((it, i) => {
        const [label, cls] = STATE_LABEL[it.state] || [it.state, ""];
        let sub = "";
        if (it.state === "downloading") {
          const bits = [];
          if (it.part) bits.push(it.part);
          bits.push(bn(Math.round(it.progress * 100)) + "%");
          if (it.size) bits.push(size(it.size));
          if (it.speed) bits.push(size(it.speed) + "/সে");
          if (it.eta != null) bits.push("বাকি " + dur(it.eta));
          sub = `<small>${bits.join(" · ")}</small><div class="bar"><i style="width:${(it.progress * 100).toFixed(1)}%"></i></div>`;
        } else if (it.state === "processing") {
          sub = `<small>ভিডিও আর অডিও জোড়া লাগানো বা রূপান্তর হচ্ছে…</small>`;
        } else if (it.state === "waiting") {
          sub = `<small>${esc(it.error)}</small>`;
        } else if (it.state === "error") {
          sub = `<small class="err">${esc(it.error)}</small>`;
        } else if (it.state === "done") {
          sub = `<small class="ok">${it.size ? size(it.size) : ""}</small>`;
        } else {
          sub = `<small>${dur(it.duration)}</small>`;
        }
        return `<li class="row">
          <span class="n">${bn(it.index || i + 1)}</span>
          <img loading="lazy" src="${thumb(it.id)}" alt="">
          <span class="t"><b>${esc(it.title)}</b>${sub}</span>
          <span class="badge ${cls}">${label}</span>
        </li>`;
      }).join("")}
    </ul>`;
  $("#view").innerHTML = html;
}

function startPolling() {
  clearInterval(S.poll);
  const tick = async () => {
    const job = await api().status();
    if (!job) return;
    S.job = job;
    renderJob(job);
    if (!job.running) { clearInterval(S.poll); S.poll = null; }
  };
  tick();
  S.poll = setInterval(tick, 700);
}

function onJobClick(ev) {
  const b = ev.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "cancel") api().cancel();
  else if (act === "skip") api().skip_current();
  else if (act === "folder") api().open_folder();
  else if (act === "retry") api().retry_failed().then((n) => { if (n) startPolling(); });
  else if (act === "new") { S.info = null; S.job = null; $("#link").value = ""; $("#link").focus(); renderEmpty(); }
}

$("#view").addEventListener("click", (ev) => { if (S.poll || (S.job && !S.info)) onJobClick(ev); else if (S.info) onInfoClick(ev); });
$("#view").addEventListener("change", onInfoChange);

// ---------- search ----------
let searching = false;
async function lookup() {
  const link = $("#link").value.trim();
  if (!link || searching) return;
  if (S.poll) { showError("আগের ডাউনলোড শেষ হওয়া পর্যন্ত অপেক্ষা করুন, অথবা বাতিল করুন।"); return; }
  searching = true; $("#find").disabled = true; showError(""); S.job = null;
  renderLoading();
  try {
    const res = await api().inspect(link);
    if (!res.ok) { showError(res.error); S.info = null; renderEmpty(); return; }
    S.info = res.data;
    S.onlyVideo = false;
    S.selected = new Set(currentEntries().map((e) => e.id));
    renderInfo();
  } finally {
    searching = false; $("#find").disabled = false;
  }
}
$("#form").addEventListener("submit", (e) => { e.preventDefault(); lookup(); });
$("#link").addEventListener("paste", () => setTimeout(lookup, 30));
$("#paste").addEventListener("click", async () => {
  const t = (await api().paste() || "").trim();
  if (t) { $("#link").value = t; lookup(); } else $("#link").focus();
});

// ---------- start ----------
window.addEventListener("pywebviewready", async () => {
  const st = await api().get_state();
  S.settings = st.settings; S.tools = st.tools; S.browsers = st.browsers || [];
  applyTheme(st.settings.theme);
  if (!st.tools.ffmpeg) {
    const n = $("#tools-note");
    n.hidden = false;
    n.textContent = "ffmpeg পাওয়া যায়নি, তাই ভিডিও সর্বোচ্চ 360p পর্যন্ত আর অডিও শুধু M4A হিসেবে ডাউনলোড হবে।";
  }
  $("#foot").textContent = `ভার্সন ${bn(st.version)} · yt-dlp ${st.ytdlp} · শুধু ব্যক্তিগত ব্যবহারের জন্য; ভিডিওর স্বত্ব সংশ্লিষ্ট নির্মাতাদের।`;
  if (st.job) { S.jobTitle = ""; S.job = st.job; startPolling(); } else renderEmpty();
  $("#link").focus();
});
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(S.settings.theme));
</script>
</body>
</html>
