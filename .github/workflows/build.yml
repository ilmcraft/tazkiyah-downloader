name: Build

# Push a tag like v1.0.0 to build and publish a release; run it by hand for a test build.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Fetch ffmpeg and deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, tmp | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile tmp/ffmpeg.zip
          Expand-Archive tmp/ffmpeg.zip tmp/ffmpeg
          Get-ChildItem tmp/ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination bin
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile tmp/deno.zip
          Expand-Archive tmp/deno.zip bin
          Get-ChildItem bin

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app
        run: pyinstaller --noconfirm --clean tazkiyah-downloader.spec

      - name: Self-test the built app (real download)
        # GitHub's runners are sometimes blocked by YouTube's bot check, so this only warns.
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist/TazkiyahDownloader/TazkiyahDownloader.exe -ArgumentList '--selftest', 'https://youtu.be/3bd5Ynr4Vv8', "$PWD/tmp/selftest" -Wait -PassThru
          Get-Content tmp/selftest/selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer.iss
          Compress-Archive dist/TazkiyahDownloader/* "dist/TazkiyahDownloader-${{ steps.v.outputs.version }}-portable.zip"
          # Unversioned copies: the website links to releases/latest/download/<these names>.
          Copy-Item "dist/TazkiyahDownloader-Setup-${{ steps.v.outputs.version }}.exe" dist/TazkiyahDownloader-Setup.exe
          Copy-Item "dist/TazkiyahDownloader-${{ steps.v.outputs.version }}-portable.zip" dist/TazkiyahDownloader-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/TazkiyahDownloader-Setup-*.exe
            dist/TazkiyahDownloader-*-portable.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TazkiyahDownloader-Setup*.exe
            dist/TazkiyahDownloader-*portable.zip
